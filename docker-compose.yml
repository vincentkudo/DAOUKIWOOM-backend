services:
  postgres:
    image: postgres:16-alpine
    container_name: roomflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roomflow}
      POSTGRES_USER: ${POSTGRES_USER:-roomflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roomflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - roomflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roomflow} -d ${POSTGRES_DB:-roomflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: roomflow-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-roomflowredis}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-roomflowredis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
    container_name: roomflow-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-roomflow}
      DB_USERNAME: ${POSTGRES_USER:-roomflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-roomflow}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-roomflowredis}
      ROOM_HOLD_SECONDS: ${ROOM_HOLD_SECONDS:-90}
      JWT_SECRET: ${JWT_SECRET:-roomflow-dev-secret-change-me-use-at-least-256-bits}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
      SEED_EMPLOYEE_PASSWORD: ${SEED_EMPLOYEE_PASSWORD:-Emp123!}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 50s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: roomflow-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped

volumes:
  roomflow_pgdata:
