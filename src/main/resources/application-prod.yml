spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: roomflow-prod
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 8000
      idle-timeout: 300000
      max-lifetime: 1700000
      validation-timeout: 3000
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain,text/html
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  seed:
    enabled: ${SEED_ENABLED:false}
  hold:
    ttl-seconds: ${ROOM_HOLD_SECONDS:90}

logging:
  level:
    root: INFO
    com.daoukiwoom.roomflow: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
