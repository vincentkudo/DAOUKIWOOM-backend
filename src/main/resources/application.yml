spring:
  application:
    name: roomflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roomflow}
    username: ${DB_USERNAME:roomflow}
    password: ${DB_PASSWORD:roomflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:roomflowredis}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

app:
  timezone: Asia/Ho_Chi_Minh
  jwt:
    secret: ${JWT_SECRET:roomflow-dev-secret-change-me-use-at-least-256-bits}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}
  seed:
    enabled: ${SEED_ENABLED:true}
  hold:
    ttl-seconds: ${ROOM_HOLD_SECONDS:90}
